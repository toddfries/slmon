# Sample configuration. The installed file is /etc/sl.conf, mode 0640,
# owner root:_sl. sld reads it as _sl. SIGHUP reads it again.

db = sqlite
db_path = /var/sl/sl.db
listen = 127.0.0.1:8080
dish_host = 192.168.100.1
dish_interval_s = 30
log_level = info

# How long each tier is kept, in days.
raw_retention_days = 90
minutely_retention_days = 730
hourly_rollup_days = 365

# How often completed minutes, hours, and days are rolled up.
rollup_interval_s = 60

# Watchdog pings. Comma-separated hosts.
ping_targets = 1.1.1.1,8.8.8.8
ping_interval_s = 10
disconnect_failures = 3
spike_ms = 200
spike_min_s = 30

# Set both, or leave both empty. Both starts the weather process.
latitude =
longitude =

# PostgreSQL instead of SQLite. db_path is unused when db = pg.
# A change to these keys, or to db_path, waits for rcctl restart sld.
# db = pg
# pg_db =
# pg_user =
# pg_password =
# pg_host =
# pg_port =
